plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.aitoyz.mapplock'
    compileSdk 37 // Android 16 (Vanilla Ice Cream)

    defaultConfig {
        applicationId "com.aitoyz.mapplock"
        minSdk 24
        targetSdk 37 // Android 16
        versionCode 1
        versionName "1.0.0"

        resConfigs "en", "hi", "ar", "es", "pt", "pt-rBR", "in", "ru", "tr", "vi", "fr", "de", "tl", "zh", "bn", "ur"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true // Essential for security apps
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Android 16 tools require Java 17+
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Modern 2026 way to configure Kotlin options
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            // Suppress warnings for pre-release SDKs if necessary
            freeCompilerArgs.add("-Xskip-prerelease-check")
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            // CRITICAL: Forces 16 KB alignment for native libraries like libmaplibre.so
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // AndroidX & Compose (2026 Stable Releases)
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.savedstate:savedstate-ktx:1.4.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // UI Framework
    implementation platform('androidx.compose:compose-bom:2026.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Maps & Location (v11.5.1+ has 16KB support and uses OpenGL by default)
    implementation 'org.maplibre.gl:android-sdk:11.5.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Media & Images
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'
    implementation 'com.airbnb.android:lottie-compose:6.7.1'

    // Security (Encryption Engine)
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "androidx.biometric:biometric:1.1.0"

    // Background Stability
    implementation "androidx.work:work-runtime-ktx:2.11.2"

    // Analytics
    implementation("com.posthog:posthog-android:3.56.2")

    // Firebase (2026 Stable)
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Camera Support (for Intruder Selfie)
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"

    // App Startup
    implementation "androidx.startup:startup-runtime:1.2.0"

    // Profile Installer for Baseline Profiles
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"

    // Testing & Debugging
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
